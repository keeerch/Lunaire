plugins {
    // Прописываем версию Loom вручную (1.2-SNAPSHOT)
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.lunaire.mod"

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.22"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.83.0+1.20.1"

    // Библиотеки для твоего меню и HUD
    modApi "me.shedaniel.cloth:cloth-config-fabric:11.1.106"
    include "me.shedaniel.cloth:cloth-config-fabric:11.1.106"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
