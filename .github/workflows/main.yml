name: Lunaire Build 1.21.4
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # ДЛЯ 1.21.4 НУЖНА ТОЛЬКО 21
          distribution: 'temurin'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
