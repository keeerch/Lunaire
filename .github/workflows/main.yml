name: Lunaire Final Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      # ВОТ ЭТОТ БЛОК НУЖЕН, ЧТОБЫ ПОЯВИЛАСЬ КНОПКА СКАЧАТЬ
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunaire-Mod-Jar
          path: build/libs/*.jar
