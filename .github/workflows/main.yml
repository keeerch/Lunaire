name: Lunaire Final Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # МЫ УБРАЛИ ENV БЛОК, так как GitHub теперь сам справляется
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Скоро выйдет v5, следи за обновлениями

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Добавляем кэш, чтобы билд шел быстрее

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
